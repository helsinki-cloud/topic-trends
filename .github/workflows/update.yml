name: 데이터 갱신 및 배포

on:
  schedule:
    # 매월 1일 01:00 UTC (= 한국 10:00 / 미국 동부 전날 저녁)
    - cron: "0 1 1 * *"
  workflow_dispatch:        # Actions 탭에서 수동 실행
  push:
    branches: [main]        # 화면/검색어 수정 시 배포만 다시 함

permissions:
  contents: write           # data/ 커밋
  pages: write              # Pages 배포
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    # push 이벤트에서는 수집하지 않음 (배포만)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest  # 표준 러너만 사용 (공개 저장소에서 무료). 바꾸지 마세요.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: PubMed 수집
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: python scripts/fetch_pubmed.py
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: PubMed 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main         # 방금 커밋한 최신 데이터 포함
      - name: 배포 파일 모으기
        run: |
          mkdir -p _site
          cp index.html app.js style.css _site/
          cp -r data _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
