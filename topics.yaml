# =====================================================================
# 진료과별 주제 검색어 사전
# ---------------------------------------------------------------------
# - query는 PubMed 검색식 그대로 씁니다. 연도 조건은 스크립트가 자동으로 붙입니다.
# - [tiab] = 제목/초록, [mh] = MeSH 주제어
# - 아래 검색식은 "초안"입니다. 반드시 PubMed 화면에서 직접 검색해
#   상위 결과가 주제에 맞는지 확인한 뒤 reviewed 날짜를 채우세요.
#   reviewed는 사서용 내부 기록이며 대시보드에는 표시되지 않습니다.
# - id는 영문 소문자/숫자/밑줄만 씁니다. 한 번 정하면 바꾸지 마세요.
# - 진료과 이름(name_ko)은 한글, 주제 이름(name)은 영어로 씁니다.
# =====================================================================

settings:
  start_year: 2005          # 수집 시작 연도
  # 종료 연도는 스크립트가 "올해"로 자동 설정합니다 (올해는 미완성 연도로 표시)

departments:

  - id: otolaryngology
    name_ko: 이비인후과
    topics:
      - id: crs_nasal_polyps
        name: "Chronic rhinosinusitis with nasal polyps (CRSwNP)"
        query: '("chronic rhinosinusitis"[tiab] AND ("nasal polyp*"[tiab] OR CRSwNP[tiab]))'
        reviewed: ""

      - id: olfactory_dysfunction
        name: "Olfactory dysfunction"
        query: '("olfactory dysfunction"[tiab] OR anosmia[tiab] OR hyposmia[tiab] OR "smell loss"[tiab])'
        reviewed: ""

      - id: cochlear_implant
        name: "Cochlear implant"
        query: '("cochlear implant*"[tiab])'
        reviewed: ""

      - id: tinnitus
        name: "Tinnitus"
        query: '(tinnitus[tiab])'
        reviewed: ""

      - id: hypoglossal_stimulation
        name: "Hypoglossal nerve stimulation"
        query: '("hypoglossal nerve stimulation"[tiab] OR "upper airway stimulation"[tiab])'
        reviewed: ""

      - id: hpv_oropharyngeal
        name: "HPV-associated oropharyngeal cancer"
        query: '((HPV[tiab] OR "human papillomavirus"[tiab]) AND oropharyn*[tiab] AND (cancer[tiab] OR carcinoma[tiab]))'
        reviewed: ""

      - id: transoral_robotic
        name: "Transoral robotic surgery (TORS)"
        query: '("transoral robotic surgery"[tiab] OR TORS[tiab])'
        reviewed: ""
        # 주의: TORS 약어가 다른 뜻으로 쓰인 논문이 섞일 수 있음 → 검토 필요

      - id: pppd
        name: "Persistent postural-perceptual dizziness (PPPD)"
        query: '("persistent postural-perceptual dizziness"[tiab] OR PPPD[tiab])'
        reviewed: ""

      - id: lpr
        name: "Laryngopharyngeal reflux (LPR)"
        query: '("laryngopharyngeal reflux"[tiab])'
        reviewed: ""

  - id: pulmonology
    name_ko: 호흡기내과
    topics:
      - id: ipf_antifibrotic
        name: "Antifibrotic therapy in pulmonary fibrosis"
        query: '(("idiopathic pulmonary fibrosis"[tiab] OR "progressive pulmonary fibrosis"[tiab]) AND (nintedanib[tiab] OR pirfenidone[tiab] OR antifibrotic*[tiab]))'
        reviewed: ""

      - id: interstitial_lung_abnormalities
        name: "Interstitial lung abnormalities (ILA)"
        query: '("interstitial lung abnormalit*"[tiab])'
        reviewed: ""

      - id: bronchiectasis
        name: "Bronchiectasis"
        query: '(bronchiectasis[tiab] NOT "cystic fibrosis"[tiab])'
        reviewed: ""

      - id: ntm
        name: "Nontuberculous mycobacterial (NTM) lung disease"
        query: '("nontuberculous mycobacteri*"[tiab] OR "non-tuberculous mycobacteri*"[tiab] OR "Mycobacterium avium complex"[tiab])'
        reviewed: ""

      - id: copd_biologics
        name: "Biologics in COPD"
        query: '((COPD[tiab] OR "chronic obstructive pulmonary disease"[tiab]) AND (dupilumab[tiab] OR mepolizumab[tiab] OR benralizumab[tiab] OR biologic*[tiab]))'
        reviewed: ""

      - id: prism
        name: "Preserved ratio impaired spirometry (PRISm)"
        query: '("preserved ratio impaired spirometry"[tiab] OR PRISm[tiab])'
        reviewed: ""
        # 주의: PRISm은 프리즘(prism)과 대소문자 구분 없이 검색됨 → 노이즈 검토 필요

      - id: lung_cancer_screening
        name: "Lung cancer screening (LDCT)"
        query: '("lung cancer screening"[tiab] OR ("low-dose"[tiab] AND "computed tomography"[tiab] AND "lung cancer"[tiab]))'
        reviewed: ""

      - id: ebus
        name: "Endobronchial ultrasound (EBUS)"
        query: '("endobronchial ultrasound"[tiab] OR EBUS[tiab])'
        reviewed: ""

      - id: vaping_lung
        name: "E-cigarettes and lung disease"
        query: '(("e-cigarette*"[tiab] OR vaping[tiab] OR EVALI[tiab]) AND (lung[tiab] OR pulmonary[tiab] OR respiratory[tiab]))'
        reviewed: ""
